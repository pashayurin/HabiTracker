<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HabiTracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal-box">
            <h2 class="modal-title">Добавить привычку</h2>

            <!-- Иконка + название в одну строку -->
            <div class="modal-top-row">
                <div class="icon-circle" id="iconCircle" onclick="openIconPicker()">
                    <span id="selectedIcon">😊</span>
                </div>
                <input
                    type="text"
                    class="habit-name-input"
                    id="habitName"
                    placeholder="название привычки"
                    maxlength="30"
                >
            </div>

            <!-- Пикер иконок -->
            <div class="icon-picker" id="iconPicker">
                <div class="icon-grid" id="iconGrid"></div>
            </div>

            <!-- Количество в день -->
            <div class="modal-row">
                <span class="modal-row-label">количество в день</span>
                <input
                    type="number"
                    class="modal-small-input"
                    id="habitCount"
                    value="1"
                    min="1"
                    max="999"
                >
            </div>

            <!-- Единица измерения -->
            <div class="modal-row">
                <span class="modal-row-label">единица измерения</span>
                <select class="modal-select" id="habitUnit">
                    <option value="раз">РАЗ</option>
                    <option value="мин">МИН</option>
                    <option value="час">ЧАС</option>
                    <option value="км">КМ</option>
                    <option value="мл">МЛ</option>
                    <option value="стр">СТР</option>
                </select>
            </div>

            <!-- Дата начала -->
            <div class="modal-row">
                <span class="modal-row-label">дата начала</span>
                <div class="date-selects">
                    <select class="modal-select-sm" id="startDay"></select>
                    <select class="modal-select-sm" id="startMonth">
                        <option value="1">ЯНВ</option>
                        <option value="2">ФЕВ</option>
                        <option value="3">МАР</option>
                        <option value="4">АПР</option>
                        <option value="5">МАЙ</option>
                        <option value="6">ИЮН</option>
                        <option value="7">ИЮЛ</option>
                        <option value="8">АВГ</option>
                        <option value="9">СЕН</option>
                        <option value="10">ОКТ</option>
                        <option value="11">НОЯ</option>
                        <option value="12">ДЕК</option>
                    </select>
                    <select class="modal-select-sm" id="startYear"></select>
                </div>
            </div>

            <!-- Дни недели -->
            <div class="modal-section">
                <span class="modal-row-label">по каким дням недели</span>
                <div class="days-row">
                    <button class="day-btn" data-day="ПН" onclick="toggleDay(this)">ПН</button>
                    <button class="day-btn" data-day="ВТ" onclick="toggleDay(this)">ВТ</button>
                    <button class="day-btn" data-day="СР" onclick="toggleDay(this)">СР</button>
                    <button class="day-btn" data-day="ЧТ" onclick="toggleDay(this)">ЧТ</button>
                    <button class="day-btn" data-day="ПТ" onclick="toggleDay(this)">ПТ</button>
                    <button class="day-btn" data-day="СБ" onclick="toggleDay(this)">СБ</button>
                    <button class="day-btn" data-day="ВС" onclick="toggleDay(this)">ВС</button>
                </div>
                <div class="days-row-all">
                    <button class="day-btn day-btn-all" onclick="toggleAllDays(this)">ВСЕ</button>
                </div>
            </div>

            <!-- Напоминания -->
            <div class="modal-row">
                <span class="modal-row-label">напоминания</span>
                <div class="reminder-row">
                    <span class="reminder-label" id="toggleLabel">нет</span>
                    <div class="toggle-switch" id="reminderToggle" onclick="toggleReminder()">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>

            <!-- Кнопки -->
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-save" onclick="saveHabit()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ШАПКА -->
    <header class="top-bar">
        <h1 class="app-title">HabiTracker</h1>
        <!-- Переключение дней -->
        <div class="date-nav">
            <button class="date-nav-btn" onclick="changeDay(-1)">&#8249;</button>
            <div class="date-nav-info">
                <span class="date-nav-day" id="dateNavDay"></span>
                <span class="date-nav-full" id="dateNavFull"></span>
            </div>
            <button class="date-nav-btn" onclick="changeDay(1)">&#8250;</button>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="content">
        <button class="add-habit-btn" onclick="openModal()">+ Добавить новую привычку</button>
        <div class="habits-list" id="habitsList"></div>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-bar">
        <div class="nav-item active" id="nav-home" onclick="showPage('home')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Главная</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="showPage('profile')">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Профиль</span>
        </div>
        <div class="nav-item" id="nav-help" onclick="showPage('help')">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Помощь</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
